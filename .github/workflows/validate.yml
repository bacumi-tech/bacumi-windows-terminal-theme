name: Validate themes and native installer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  schemes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/build.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py
  windows-installer:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Native install and uninstall in temporary directories
        shell: ${{ matrix.shell }}
        run: |
          $PSVersionTable.PSVersion
          ./tests/install.Tests.ps1

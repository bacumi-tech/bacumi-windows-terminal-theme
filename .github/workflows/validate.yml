name: Validate themes and native installer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  schemes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/build.py --check
      - run: python3 scripts/build-developer-preview.py --check
      - run: python3 scripts/build-icons.py --check
      - run: python3 scripts/check-brand.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py
      - run: python3 scripts/check-package.py
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Windows PowerShell 5.1 install and uninstall
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          ./tests/install.Tests.ps1
          ./tests/prompt.Tests.ps1
          ./tests/install-prompt.Tests.ps1
          ./tests/font.Tests.ps1
          ./scripts/benchmark-prompt.ps1 -Samples 10
      - name: PowerShell 7 install and uninstall
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          ./tests/install.Tests.ps1
          ./tests/prompt.Tests.ps1
          ./tests/install-prompt.Tests.ps1
          ./tests/font.Tests.ps1
          ./scripts/benchmark-prompt.ps1 -Samples 10
